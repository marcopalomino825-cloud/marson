function shop(){if(!q&&cat==0)return (DB?"":'<div class="box" style="font-size:12px">⚠️ Sin conexión a la nube: tu pedido se guarda en tu celular. Avísanos por WhatsApp.</div>')+`<div class="ban"><div><b>Calidad y buen precio siempre</b><p>Haz tu pedido y sigue comprando mientras te lo alistamos</p><button id="instBtn" class="yb" onclick="instalar()">📲 Instalar app</button></div><div class="bi">🛒</div></div>${recentCard()}<div class="tg">${CATS.slice(1).map((_,i)=>i+1).filter(c=>P.some(p=>p.c==c&&!p.off)).map(tile).join("")}</div>`;
const L=P.filter(p=>(cat==0||p.c==cat)&&!p.off&&p.n.toLowerCase().includes(q.toLowerCase()));
return `<h2><button class="sm" onclick="goHome()">←</button> ${cat?CATS[cat]:"Resultados"}</h2><div class="g">${L.map(card).join("")||'<div class="empty">Sin resultados</div>'}</div>`}
function tabs(){const t=$("#tabs");if(!(view=="shop"&&cat>0)){t.style.display="none";return}t.style.display="";t.innerHTML="";CATS.slice(1).forEach((c,i)=>{const b=document.createElement("button");b.textContent=c;b.className=cat==i+1?"on":"";b.onclick=()=>{cat=i+1;q="";$("#gs").value="";render()};t.appendChild(b)})}
function goHome(){cat=0;q="";$("#gs").value="";view="shop";render()}
function focusSearch(){view="shop";cat=0;render(true);$("#gs").focus()}
function cartGo(){if(!count())return alert("Tu lista está vacía. Agrega productos.");view="cart";render()}
const LOGO=document.querySelector("header img").src;
const pid=i=>i[5]!=null?+i[5]:(P.find(p=>p.n==i[0])||{}).id;
function delItem(i){delete cart[i];save();render(true)}

function enviar(){
